<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade HTML 01</title>
</head>
<body>
    <!-- Título principal da página -->
    <h1>Atividade HTML - início</h1>

    <!-- Bloco com os parágrafos -->
    <div>
        <!-- Parágrafo com texto em negrito -->
        <p>Este é o meu primeiro <strong>parágrafo</strong> feito em HTML,</p>

        <!-- Linha horizontal separadora -->
        <hr>

        <!-- Quebra de linha, link externo e caractere especial -->
        <p>continuo aprendendo HTML, <br>agora conhecendo mais tags! Com
            <a href="https://portal.uneb.br/" target="_blank">este link</a>
            você vai para o portal da UNEB. Neste código eu mostro o sinal de menor: &lt;</p>

        <!-- Texto com estilo inline -->
        <p>O <span style="color: red;">HTML</span> é a base da web.</p>
    </div>

    <!-- Link isolado para o portal -->
    <a href="https://portal.uneb.br/" target="_blank">Portal da UNEB</a>
    <hr>

    <!-- Imagem do jogo educativo (arquivo na mesma pasta) -->
    <img src="../geme.png" alt="Jogo Educativo">
</body>
</html>
