<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!-- Define a codificação para os acentos aparecerem certo -->
  <meta charset="UTF-8">
  <!-- Faz a página se ajustar à tela do celular -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Título que aparece na aba do navegador -->
  <title>CSS em lista e tabelas</title>
  <!-- Liga o arquivo de estilo (CSS) à página -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== LISTAS ===== -->
  <h2>Exemplo de Listas</h2>

  <!-- Lista com marcador quadrado (estilo definido em .lista1) -->
  <ul class="lista1">
    <li>Item com marcador quadrado</li>
    <li>Outro item</li>
  </ul>

  <!-- Lista numerada com algarismos romanos (estilo definido em .lista2) -->
  <ol class="lista2">
    <li>Primeiro item em algarismo romano</li>
    <li>Segundo item</li>
  </ol>

  <!-- Lista com imagem como marcador (estilo definido em .lista3) -->
  <ul class="lista3">
    <li>Item com marcador de imagem</li>
    <li>Mais um item</li>
  </ul>

  <!-- ===== TABELA ===== -->
  <h2>Exemplo de Tabela</h2>

  <table class="tabela">
    <!-- Linha do cabeçalho: th são as células de título -->
    <tr>
      <th>Nome</th>
      <th>Idade</th>
      <th>Cidade</th>
    </tr>
    <!-- Linhas de dados: td são as células comuns -->
    <tr>
      <td>Ana</td>
      <td>25</td>
      <td>Salvador</td>
    </tr>
    <tr>
      <td>Pedro</td>
      <td>30</td>
      <td>Recife</td>
    </tr>
    <tr>
      <td>Maria</td>
      <td>28</td>
      <td>Fortaleza</td>
    </tr>
  </table>

</body>
</html>
