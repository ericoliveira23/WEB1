<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trabalhando com CSS</title>

  <!-- CSS externo: arquivo style.css -->
  <link rel="stylesheet" href="style.css">

  <!-- CSS interno: escrito dentro do próprio HTML -->
  <style>

  </style>
</head>
<body>
  <h1>Aprendendo CSS</h1>

  <!-- CSS inline: escrito direto na tag -->
  <p style="color: red; font-weight: bold;">Este texto está estilizado inline!</p>
</body>
</html>
